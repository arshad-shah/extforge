# Automated release powered by Changesets.
#
# How it works:
# 1. Contributors run `pnpm changeset` and commit a `.changeset/*.md` file
#    on their PR describing the change (patch/minor/major).
# 2. When that PR merges into `main`, this workflow runs.
# 3. If pending changesets exist, the action opens (or updates) a "Version
#    Packages" PR that bumps `package.json`, regenerates `CHANGELOG.md`, and
#    deletes the consumed changeset files.
# 4. When the maintainer merges the "Version Packages" PR, this workflow
#    runs again and publishes the new version to npm + creates a GitHub
#    release.
#
# Hardening:
# - All third-party actions are SHA-pinned.
# - The publish step runs in the `npm-publish` GitHub Environment, which is
#   configured with required reviewers. Any tokens stored there are
#   environment-scoped, not repo-wide.
# - npm trusted publishing (OIDC) is configured on npmjs.com against this
#   repo + workflow + environment. The `id-token: write` permission below
#   is what lets the OIDC token mint happen. No npm token is involved:
#   changesets/action v2 no longer writes an `.npmrc` from `NPM_TOKEN`, and
#   the published tarballs carry SLSA provenance, which only OIDC can
#   produce.
# - `NPM_CONFIG_PROVENANCE: true` attaches an SLSA provenance attestation
#   to every published tarball.
# - Release commits and tags are pushed through the GitHub API (the v2
#   default), so they are signed with GitHub's GPG key and need no git
#   credentials — which is why `persist-credentials: false` below is safe.
# - `if: github.repository == 'arshad-shah/extforge'` prevents forks from
#   publishing.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    if: github.repository == 'arshad-shah/extforge'
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Typecheck/lint/test already ran on the PR (and on the Version
      # Packages PR opened by changesets) via `ci.yml`. The merge commit
      # this workflow runs against is the exact tested SHA. Only `build`
      # is repeated here because the publish step needs `dist/`.
      - name: Build
        run: pnpm build

      - name: Upgrade bundled npm for OIDC support
        run: npm install -g npm@11.5.1

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1  # v2.1.1
        with:
          version-script: pnpm exec changeset version
          publish-script: pnpm exec changeset publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
